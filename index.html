<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="TRIANGLE — commande en ligne, e-menu et suivi de commande en temps réel." />
    <!-- iOS: fait tourner l'app en mode standalone (sans barre Safari) une fois installée -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRIANGLE" />
    <title>TRIANGLE</title>
    <!-- Sets the .dark class on <html> before first paint, from the same
         precedence ThemeContext uses (explicit choice > OS preference >
         light). Blocking and inline on purpose: React hasn't hydrated yet,
         so without this the page would flash light-mode zinc-50 for a beat
         even on a dark-preferring device or a visitor who chose dark last
         time — this line closes that gap. Keep it in sync with
         getInitialTheme() in src/contexts/ThemeContext.tsx if that logic
         ever changes. -->
    <script>
      (function () {
        try {
          // Brand colours chosen in Settings (cached by src/lib/brand.ts):
          // applied here so there is no flash of the default orange.
          var brand = JSON.parse(localStorage.getItem('triangle_brand') || 'null');
          if (brand && brand.vars) {
            for (var k in brand.vars) document.documentElement.style.setProperty(k, brand.vars[k]);
            if (brand.light) document.documentElement.setAttribute('data-brand-light', '');
          }
          var stored = localStorage.getItem('triangle_theme');
          var def = localStorage.getItem('triangle_default_theme');
          var dark = stored ? stored === 'dark'
            : def === 'dark' ? true
            : def === 'light' ? false
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* ignore (private browsing, etc.) — falls back to light */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
